<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Omni Butler 知序小管家</title>
  <desc id="desc">奶油色圆角底上的小管家，以可可棕勾勒圆脸、小圆眼和轻轻上扬的嘴角，搭配焦糖色领结，神态安静亲切。</desc>
  <defs>
    <!-- 奶油色为主色，细微暖色变化保留柔和的层次。 -->
    <linearGradient id="canvas" x1="12" y1="4" x2="49" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6E6"/>
      <stop offset="1" stop-color="#F2E1C7"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板保留透明四角，适配浅色与深色桌面。 -->
  <rect width="64" height="64" rx="16" fill="url(#canvas)"/>

  <!-- 可可色轮廓区分奶白圆脸与奶油底板，保留圆润的小发梢。 -->
  <path d="M25 10C20 9 16 11 15 15C14.5 17 15 19 16.5 20.5C14.8 23.1 14 26.4 14 30C14 40 20.5 46 32 46C43.5 46 50 40 50 30C50 18.4 43 12 32.5 12C30 12 27.5 11.5 25 10Z" fill="#FFFCF5" stroke="#79604C" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 小圆眼与短而平缓的嘴角，让表情更自然克制。 -->
  <circle cx="25" cy="28.5" r="1.8" fill="#644A38"/>
  <circle cx="39" cy="28.5" r="1.8" fill="#644A38"/>
  <path d="M30 35.5C31.6 36.4 33.6 36.1 35 34.8" fill="none" stroke="#79604C" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 焦糖色领结与可可色结心呼应五官，明确管家身份。 -->
  <path d="M22 48.5C21 48 20 48.7 20 50V56C20 57.3 21 58 22 57.5L29 54.5V51.5Z" fill="#B8825D"/>
  <path d="M42 48.5C43 48 44 48.7 44 50V56C44 57.3 43 58 42 57.5L35 54.5V51.5Z" fill="#B8825D"/>
  <rect x="29.5" y="50.5" width="5" height="5" rx="1.8" fill="#79604C"/>
</svg>
