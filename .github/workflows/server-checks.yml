name: Server checks

on:
  pull_request:
    paths: ['apps/server/**', '.github/workflows/server-checks.yml']
  push:
    branches: [main]
    paths: ['apps/server/**', '.github/workflows/server-checks.yml']

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/omni_butler
        run: npm run prisma:generate
      - name: Run server tests
        run: npm test
