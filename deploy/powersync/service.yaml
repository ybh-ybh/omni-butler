# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
_type: self-hosted

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URI
  allow_local_jwks: true
  audience:
    - omni-butler-powersync

# 当前只从本地文件加载同步规则，不向管理接口授予访问令牌。
api:
  tokens: []

telemetry:
  disable_telemetry_sharing: true

system:
  logging:
    level: info
    format: json
