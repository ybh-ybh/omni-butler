config:
  edition: 3

streams:
  current_user_data:
    auto_subscribe: true
    queries:
      - >-
        SELECT id, parent_id, title, description, scheduled_date, due_at, priority_quadrant,
        is_completed, completed_at, reminder_at, repeat_rule,
        repeat_series_id, sort_order, created_at, updated_at, deleted_at
        FROM todo_items WHERE user_id = auth.user_id()
      - >-
        SELECT id, content, source, is_enabled, created_at, updated_at, deleted_at
        FROM quotes WHERE user_id = auth.user_id()
      - >-
        SELECT id, day_key, quote_id, created_at, updated_at
        FROM daily_quote_selections WHERE user_id = auth.user_id()
      - >-
        SELECT id, module, kind, name, color_value,
        sort_order, is_enabled, created_at, updated_at,
        deleted_at FROM taxonomy_entries WHERE user_id = auth.user_id()
      - >-
        SELECT id, module, record_id, taxonomy_id, created_at, deleted_at
        FROM record_taxonomy_links WHERE user_id = auth.user_id()
      - >-
        SELECT id, name, category, description, interval_value, interval_unit,
        last_completed_at, reminder_enabled, reminder_days_before,
        reminder_time_minutes, is_archived, archived_at, notes, created_at,
        updated_at, deleted_at FROM events WHERE user_id = auth.user_id()
      - >-
        SELECT id, event_id, completed_at, notes, source, is_revoked,
        created_at, deleted_at FROM event_completions
        WHERE user_id = auth.user_id()
      - >-
        SELECT id, name, category, quantity,
        purchase_price_cents, purchase_date, purchase_url, purchase_platform, location, status,
        warranty_expiration, tags, parent_item_id, notes,
        created_at, updated_at, deleted_at FROM inventory_items
        WHERE user_id = auth.user_id()
      - >-
        SELECT id, entry_date, start_minute, end_minute, started_at, ended_at,
        activity, category, notes, created_at, updated_at, deleted_at FROM time_entries
        WHERE user_id = auth.user_id()
      - >-
        SELECT id, name, provider, category, description, website_url,
        purchase_platform, price_cents, billing_cycle,
        base_status, purchase_date, expiration_date, is_permanent, auto_renew,
        renewal_date, needs_renewal,
        expiration_reminder_enabled, expiration_reminder_days,
        renewal_reminder_enabled, renewal_reminder_days, reminder_time_minutes,
        cancel_guide, notes, created_at, updated_at,
        deleted_at FROM memberships WHERE user_id = auth.user_id()
      - >-
        SELECT id, membership_id, amount_cents, paid_at,
        valid_from, valid_until, notes, created_at, deleted_at
        FROM membership_payments WHERE user_id = auth.user_id()
