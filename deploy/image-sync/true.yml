services:
  api:
    depends_on:
      minio:
        condition: service_healthy
  image-credentials:
    image: node:24-bookworm-slim
    restart: on-failure
    user: "0:0"
    command: ["node", "/bootstrap/initialize-credentials.mjs"]
    volumes:
      - ./initialize-credentials.mjs:/bootstrap/initialize-credentials.mjs:ro
      - image-storage-credentials:/credentials
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /credentials/access-key
      MINIO_ROOT_PASSWORD_FILE: /credentials/secret-key
      MINIO_BROWSER: "off"
    volumes:
      - image-storage-credentials:/credentials:ro
      - image-storage-data:/data
    depends_on:
      image-credentials:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
