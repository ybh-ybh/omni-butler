services:
  api:
    depends_on:
      minio:
        condition: service_healthy
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/bootstrap/start-minio.sh"]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /credentials/access-key
      MINIO_ROOT_PASSWORD_FILE: /credentials/secret-key
      MINIO_BROWSER: "off"
    volumes:
      - ./start-minio.sh:/bootstrap/start-minio.sh:ro
      - image-storage-credentials:/credentials
      - image-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
