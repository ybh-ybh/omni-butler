services:
  api:
    depends_on:
      minio:
        condition: service_healthy
  image-credentials:
    image: node:24-bookworm-slim
    restart: on-failure
    user: "0:0"
    command: ["node", "/bootstrap/initialize-credentials.mjs"]
    volumes:
      - ./initialize-credentials.mjs:/bootstrap/initialize-credentials.mjs:ro
      - image-storage-credentials:/credentials
  minio:
    build:
      context: ../minio
    image: omni-butler/minio:source-9e49d5e7a648-internal-v1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /credentials/access-key
      MINIO_ROOT_PASSWORD_FILE: /credentials/secret-key
      MINIO_BROWSER: "off"
    volumes:
      - image-storage-credentials:/credentials:ro
      - image-storage-data:/data
    depends_on:
      image-credentials:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
