name: omni-butler

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: omni_butler
      POSTGRES_USER: omni_butler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-powersync.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_butler -d omni_butler"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../apps/server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://omni_butler:${POSTGRES_PASSWORD}@postgres:5432/omni_butler?schema=public
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      POWERSYNC_URL: ${POWERSYNC_PUBLIC_URL:-}
      JWT_KEYS_DIR: /app/keys
      SYNC_SECRET: ${SYNC_SECRET}
      IMAGE_SYNC_ENABLED: ${IMAGE_SYNC_ENABLED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_CREDENTIALS_FILE: /app/image-storage/credentials.json
      NOTE_ASR_PROVIDER: ${NOTE_ASR_PROVIDER:-none}
      NOTE_ASR_MODEL: ${NOTE_ASR_MODEL:-16k_zh}
      NOTE_ASR_PUBLIC_URL: ${NOTE_ASR_PUBLIC_URL:-}
      TENCENT_ASR_APP_ID: ${TENCENT_ASR_APP_ID:-}
      TENCENT_ASR_SECRET_ID: ${TENCENT_ASR_SECRET_ID:-}
      TENCENT_ASR_SECRET_KEY: ${TENCENT_ASR_SECRET_KEY:-}
    volumes:
      - api-keys:/app/keys
      - image-storage-credentials:/app/image-storage:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/omni-butler/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${API_HOST_PORT:-3000}:3000"

  # 原音和图片共享常驻私有存储，图片业务开关不影响原音。
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/bootstrap/start-minio.sh"]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /credentials/access-key
      MINIO_ROOT_PASSWORD_FILE: /credentials/secret-key
      MINIO_BROWSER: "off"
    volumes:
      - ./image-sync/start-minio.sh:/bootstrap/start-minio.sh:ro
      - image-storage-credentials:/credentials
      - image-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24

  powersync:
    image: journeyapps/powersync-service@sha256:bf46f66e5dcc8f6a084de02ab51155dfa655bc610aa95009fff1c36f949c0acf
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_JWKS_URI: http://api:3000/omni-butler/api/v1/auth/jwks
      NODE_OPTIONS: --max-old-space-size=768
      PS_DATA_SOURCE_URI: postgresql://omni_butler:${POSTGRES_PASSWORD}@postgres:5432/omni_butler
      PS_STORAGE_URI: postgresql://omni_butler:${POSTGRES_PASSWORD}@postgres:5432/powersync_storage
    volumes:
      - ./powersync:/config:ro
    ports:
      - "${POWERSYNC_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/probes/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  postgres-data:
  api-keys:
  image-storage-credentials:
  image-storage-data:
